<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopEase Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b10;color:#fff;font:15px Arial}header{padding:18px;background:#1b101a;display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:bold;color:#f5d68e}.wrap{max-width:1150px;margin:22px auto;padding:0 14px}.panel,.stat{background:#241722;border:1px solid #ffffff20;border-radius:14px;padding:17px}#login{max-width:420px;margin:45px auto}label{display:block;margin:12px 0 5px}input,select{width:100%;padding:11px;border-radius:8px;border:1px solid #66505e;background:white;color:#21121a}button{padding:11px 16px;border:0;border-radius:9px;background:#d71960;color:white;font-weight:bold;cursor:pointer}.secondary{background:#51404c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:16px 0}.stat strong{display:block;font-size:25px;color:#ffe0a0;margin-top:8px}.toolbar{display:grid;grid-template-columns:1fr 180px auto;gap:10px;margin:14px 0}.tablewrap{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ffffff20;text-align:left;font-size:13px;vertical-align:top}th{color:#f5d68e}#app{display:none}.muted{color:#cbbcc5}@media(max-width:600px){.toolbar{grid-template-columns:1fr}header{gap:10px;flex-wrap:wrap}}
</style></head><body><header><div class="brand">SHOPEASE ✦ ADMIN</div><button id="logout" class="secondary" style="display:none">Logout</button></header>
<div class="wrap"><section id="login" class="panel"><h2>Admin Login</h2><p class="muted">Use your Supabase admin account.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button style="width:100%;margin-top:15px">Login</button></form><p id="loginMsg" class="muted"></p></section>
<section id="app"><h1>Orders Dashboard</h1><div class="grid">
<div class="stat">Total Orders<strong id="totalOrders">0</strong></div><div class="stat">Total Sales<strong id="totalSales">₹0</strong></div>
<div class="stat">Pending<strong id="pending">0</strong></div><div class="stat">Confirmed<strong id="confirmed">0</strong></div><div class="stat">Shipped<strong id="shipped">0</strong></div><div class="stat">Delivered<strong id="delivered">0</strong></div><div class="stat">Cancelled<strong id="cancelled">0</strong></div></div>
<div class="panel"><h2>Customer Orders</h2><div class="toolbar"><input id="search" placeholder="Search order/name/mobile/PIN"><select id="filter"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select><button id="refresh" class="secondary">Refresh</button></div><p id="msg" class="muted"></p><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Address</th><th>Product</th><th>Qty</th><th>COD Total</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://tnkodckrxqgmhxnhiqjt.supabase.co",SUPABASE_ANON_KEY="sb_publishable_ZGlNpZGEXIc2EOdYKwoFUA_GzQA0euf";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let orders=[];
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){ $('msg').textContent='Loading...';const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(1000);if(error){$('msg').textContent='Load error: '+error.message;return;}orders=data||[];$('totalOrders').textContent=orders.length;$('totalSales').textContent=money(orders.filter(x=>x.status!=='Cancelled').reduce((s,x)=>s+Number(x.total_amount||0),0));for(const s of ['Pending','Confirmed','Shipped','Delivered','Cancelled'])$(s.toLowerCase()).textContent=orders.filter(x=>x.status===s).length;$('msg').textContent=orders.length+' orders loaded';render();}
function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const list=orders.filter(o=>(!f||o.status===f)&&(!q||[o.order_number,o.customer_name,o.mobile,o.pincode].some(v=>String(v||'').toLowerCase().includes(q))));$('rows').innerHTML=list.map(o=>`<tr><td><b>${esc(o.order_number||o.id)}</b><br>${new Date(o.created_at).toLocaleString('en-IN')}</td><td>${esc(o.customer_name)}<br>${esc(o.mobile)}</td><td>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pincode)}<br>${esc(o.landmark)}</td><td>${esc(o.product_name)}<br>${esc(o.coupon_code||'No coupon')}</td><td>${o.quantity}</td><td>${money(o.total_amount)}</td><td><select class="status" data-id="${o.id}">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="7">No orders found.</td></tr>';document.querySelectorAll('.status').forEach(x=>x.addEventListener('change',async e=>{const newStatus=e.target.value;const update={status:newStatus};if(newStatus==='Confirmed')update.confirmed_at=new Date().toISOString();const {error}=await db.from('orders').update(update).eq('id',e.target.dataset.id);if(error)alert(error.message);await load();}));}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='Signing in...';const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent=error.message;return;}const {error:check}=await db.from('orders').select('id').limit(1);if(check){await db.auth.signOut();$('loginMsg').textContent='Admin access denied. Check admin registration and RLS policies.';return;}$('login').style.display='none';$('app').style.display='block';$('logout').style.display='block';await load();});
$('logout').onclick=async()=>{await db.auth.signOut();location.reload();};$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;
if(!SUPABASE_URL.includes('PASTE_')&&!SUPABASE_ANON_KEY.includes('PASTE_'))db.auth.getSession().then(async({data})=>{if(data.session){const{error}=await db.from('orders').select('id').limit(1);if(!error){$('login').style.display='none';$('app').style.display='block';$('logout').style.display='block';load();}}});
</script></body></html>
